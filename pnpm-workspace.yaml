packages:
  - .
  - playground
  - playground-starlight
ignoreWorkspaceRootCheck: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - 'case-police'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
allowBuilds:
  esbuild: true
  oxc-resolver: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@astrojs/*'
  - '@cspell/*'
  - '@kitschpatrol/*'
  - astro
  - cspell
  - cspell-config-lib
  - cspell-dictionary
  - cspell-gitignore
  - cspell-glob
  - cspell-grammar
  - cspell-io
  - cspell-lib
  - cspell-trie-lib
